# Once a day, checks that the live site and the outside services it needs still work (.github/scripts/daily-check.ts):
# every page in the sitemap, every script and style file, a few other addresses, the HTTPS certificate, and Open-Meteo
# as Frost Dates and Line Dry use it. It reads public pages only; nothing about visitors is collected. GitHub emails a
# failed run to whoever last changed this schedule, and turns scheduled runs off after 60 days without a commit (the
# Actions tab turns them back on).
name: Daily check

on:
  schedule:
    - cron: '17 11 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --experimental-strip-types --disable-warning=ExperimentalWarning .github/scripts/daily-check.ts
