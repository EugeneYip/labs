<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0a09" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- The build copies this page for each experiment and swaps in its own title, description, and address. -->
    <title>Labs</title>
    <meta name="description" content="Small software experiments, built and shipped rapidly." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Labs" />
    <meta property="og:title" content="Labs" />
    <meta property="og:description" content="Small software experiments, built and shipped rapidly." />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>Labs needs JavaScript to run.</noscript>
    <script>
      // If the site's code can't start (a failed download, or a browser too old for it), say so instead of leaving a blank page.
      addEventListener(
        'error',
        function (event) {
          // Only the site's own scripts count, not errors from browser extensions.
          var source = event.target && event.target.tagName === 'SCRIPT' ? event.target.src : event instanceof ErrorEvent ? event.filename : ''
          if (!source || source.indexOf(location.origin) !== 0) return
          setTimeout(function () {
            var root = document.getElementById('root')
            if (!root || root.firstChild) return
            root.innerHTML = '<p style="max-width:34rem;margin:20vh auto;padding:0 1rem;font:1rem/1.5 system-ui,sans-serif">Labs couldn’t start in this browser. Check the connection and reload the page, or try a recent version of Safari, Chrome, Edge, or Firefox.</p>'
          }, 0)
        },
        true,
      )
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
